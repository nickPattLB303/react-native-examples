<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 375 812" font-family="sans-serif" width="375" height="812">
  <!-- Force full canvas size for renderers -->
  <rect width="375" height="812" fill="transparent"/>
  <!-- Background -->
  <rect width="375" height="812" fill="#F8F9FA" />

  <!-- Header -->
  <g id="header">
    <rect width="375" height="90" fill="#B0E0E6"/>
    <text x="187.5" y="65" font-size="18" font-weight="bold" fill="#495057" text-anchor="middle">Account</text>
  </g>

  <!-- Profile Section -->
  <g id="profile-section" transform="translate(0, 105)">
    <circle cx="187.5" cy="50" r="35" fill="#CED4DA"/>
    <text x="187.5" y="55" font-size="30" font-weight="bold" fill="#FFFFFF" text-anchor="middle">T</text> <!-- Initial Placeholder -->
    <text x="187.5" y="110" font-size="18" font-weight="bold" fill="#495057" text-anchor="middle">Terry (1974)</text>
    <text x="187.5" y="130" font-size="12" fill="#6C757D" text-anchor="middle">Member ID: 123456789</text>
  </g>

  <!-- Account Options List -->
  <g id="account-options" transform="translate(15, 260)">
    <!-- Item 1: Personal Information -->
    <rect y="0" width="345" height="55" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="0.5" rx="8" ry="8"/>
    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" stroke="#6C757D" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round" transform="translate(15, 18) scale(0.8)"/>
    <circle cx="12" cy="7" r="4" stroke="#6C757D" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round" transform="translate(15, 18) scale(0.8)"/>
    <text x="50" y="33" font-size="14" fill="#495057">Personal Information</text>
    <path d="M310 23 l5 5 l-5 5" stroke="#ADB5BD" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/> <!-- Chevron -->

    <!-- Item 2: Payment Methods -->
    <rect y="65" width="345" height="55" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="0.5" rx="8" ry="8"/>
    <rect x="15" y="83" width="20" height="14" rx="2" fill="none" stroke="#6C757D" stroke-width="1.5"/> <!-- Credit Card Icon -->
    <line x1="15" y1="88" x2="35" y2="88" stroke="#6C757D" stroke-width="1.5"/>
    <text x="50" y="98" font-size="14" fill="#495057">Payment Methods</text>
    <path d="M310 88 l5 5 l-5 5" stroke="#ADB5BD" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/> <!-- Chevron -->

    <!-- Item 3: Communication Preferences -->
    <rect y="130" width="345" height="55" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="0.5" rx="8" ry="8"/>
    <path d="M4 4h16v12H4z M22 8l-5.5 3.5L11 8" stroke="#6C757D" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round" transform="translate(13, 148) scale(0.9)"/> <!-- Mail Icon -->
    <text x="50" y="163" font-size="14" fill="#495057">Communication Preferences</text>
    <path d="M310 153 l5 5 l-5 5" stroke="#ADB5BD" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/> <!-- Chevron -->

    <!-- Item 4: Security -->
    <rect y="195" width="345" height="55" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="0.5" rx="8" ry="8"/>
    <rect x="18" y="213" width="18" height="14" rx="2" stroke="#6C757D" stroke-width="1.5" fill="none"/> <!-- Lock Body -->
    <path d="M27 213v-3a4.5 4.5 0 0 0 -9 0v3" stroke="#6C757D" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/> <!-- Lock Shackle -->
    <text x="50" y="228" font-size="14" fill="#495057">Security</text>
    <path d="M310 218 l5 5 l-5 5" stroke="#ADB5BD" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/> <!-- Chevron -->

     <!-- Item 5: Help & Support -->
    <rect y="260" width="345" height="55" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="0.5" rx="8" ry="8"/>
    <circle cx="27" cy="288" r="10" stroke="#6C757D" stroke-width="1.5" fill="none"/> <!-- Question Mark Circle -->
    <path d="M27 284 a 2 2 0 0 1 2 2 c 0 1 -1 1.5 -2 2 v 1" stroke="#6C757D" stroke-width="1.5" fill="none"/>
    <circle cx="27" cy="293" r="0.5" fill="#6C757D" stroke="#6C757D" stroke-width="1"/>
    <text x="50" y="293" font-size="14" fill="#495057">Help &amp; Support</text>
    <path d="M310 283 l5 5 l-5 5" stroke="#ADB5BD" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/> <!-- Chevron -->
  </g>

  <!-- Logout Button -->
   <g transform="translate(15, 650)">
      <rect x="0" y="0" width="345" height="40" rx="4" ry="4" fill="#FFFFFF" stroke="#DC3545" stroke-width="1"/>
      <text x="172.5" y="25" font-size="14" font-weight="500" fill="#DC3545" text-anchor="middle">Log Out</text>
   </g>


  <!-- Bottom Navigation Bar -->
  <g id="bottom-nav" transform="translate(0, 728)">
    <rect width="375" height="84" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="0.5"/>
    <!-- Icons -->
    <g transform="translate(36.875, 15)"> <!-- Home -->
       <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" stroke="#6C757D" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
       <polyline points="9 22 9 12 15 12 15 22" stroke="#6C757D" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
       <text x="10" y="35" font-size="10" fill="#6C757D" text-anchor="middle">Home</text>
    </g>
     <g transform="translate(130.625, 15)"> <!-- Prescriptions -->
       <path d="M10.5 20.5 A 10 10 0 0 1 10.5 0.5 A 10 10 0 0 1 10.5 20.5 M 5 10 L 16 10 M 10.5 5 L 10.5 15" stroke="#6C757D" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/> <!-- Capsule Icon -->
       <text x="10" y="35" font-size="10" fill="#6C757D" text-anchor="middle">Prescriptions</text>
    </g>
     <g transform="translate(224.375, 15)"> <!-- Orders -->
        <path d="M1 3h15v13H1z M16 8h4l3 3v5h-7V8z" stroke="#6C757D" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/> <!-- Truck Icon -->
        <circle cx="5.5" cy="18.5" r="2.5" stroke="#6C757D" stroke-width="1.5" fill="none"/>
        <circle cx="18.5" cy="18.5" r="2.5" stroke="#6C757D" stroke-width="1.5" fill="none"/>
       <text x="10" y="35" font-size="10" fill="#6C757D" text-anchor="middle">Orders</text>
    </g>
     <g transform="translate(318.125, 15)"> <!-- Account (Selected) -->
       <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" stroke="#5EADD3" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
       <circle cx="12" cy="7" r="4" stroke="#5EADD3" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
       <text x="10" y="35" font-size="10" fill="#5EADD3" text-anchor="middle" font-weight="bold">Account</text>
    </g>
    <!-- Home indicator -->
    <rect x="121" y="70" width="134" height="5" rx="2.5" fill="#495057"/>
  </g>
</svg>