<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 375 812" font-family="sans-serif" width="375" height="812">
  <!-- Force full canvas size for renderers -->
  <rect width="375" height="812" fill="transparent"/>
  <!-- Background -->
  <rect width="375" height="812" fill="#F8F9FA" />

  <!-- Header -->
  <g id="header">
    <rect width="375" height="90" fill="#B0E0E6"/>
    <!-- Back Arrow -->
    <path d="M15 50 L25 40 L15 30" stroke="#495057" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" transform="translate(5, 15)"/>
    <text x="187.5" y="65" font-size="18" font-weight="bold" fill="#495057" text-anchor="middle">Orders</text>
  </g>

  <!-- Main Content Card -->
  <g id="order-card" transform="translate(15, 105)">
    <rect width="345" height="280" rx="8" ry="8" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="0.5"/>

    <!-- Order Details -->
    <text x="15" y="30" font-size="20" font-weight="bold" fill="#495057">Welchol</text>
    <text x="15" y="50" font-size="14" fill="#6C757D">40 mg</text>
    <text x="15" y="75" font-size="12" fill="#6C757D">Order placed: February 5, 2022</text>
    <text x="15" y="90" font-size="12" fill="#6C757D">Order number: 230084527</text>

    <!-- Horizontal Status Tracker -->
    <g id="status-tracker" transform="translate(15, 120)">
      <line x1="30" y1="25" x2="300" y2="25" stroke="#CED4DA" stroke-width="2"/>
      <!-- Placed -->
      <circle cx="30" cy="25" r="8" fill="#28A745"/>
      <path d="M26 25 l3 3 l6 -6" stroke="#FFFFFF" stroke-width="1.5" fill="none" stroke-linecap="round"/>
      <text x="30" y="45" font-size="10" fill="#6C757D" text-anchor="middle">Placed</text>
      <!-- Processing -->
      <circle cx="120" cy="25" r="8" fill="#28A745"/>
      <path d="M116 25 l3 3 l6 -6" stroke="#FFFFFF" stroke-width="1.5" fill="none" stroke-linecap="round"/>
      <text x="120" y="45" font-size="10" fill="#6C757D" text-anchor="middle">Processing</text>
      <!-- Shipped -->
      <circle cx="210" cy="25" r="8" fill="#28A745"/>
      <path d="M206 25 l3 3 l6 -6" stroke="#FFFFFF" stroke-width="1.5" fill="none" stroke-linecap="round"/>
      <text x="210" y="45" font-size="10" fill="#6C757D" text-anchor="middle">Shipped</text>
      <!-- Delivered (Current) -->
      <circle cx="300" cy="25" r="10" fill="#28A745"/>
      <path d="M291 23h10v8h-10z M306 26h2l1.5 1.5v3h-3.5V26z" stroke="#FFFFFF" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round"/> <!-- Mini Truck -->
      <circle cx="294.5" cy="32.5" r="1" fill="#FFFFFF"/>
      <circle cx="302.5" cy="32.5" r="1" fill="#FFFFFF"/>
      <text x="300" y="45" font-size="10" fill="#28A745" font-weight="bold" text-anchor="middle">Delivered</text>

      <!-- Status Text -->
      <text x="15" y="75" font-size="14" font-weight="bold" fill="#28A745">Your medication was delivered.</text>
    </g>

     <!-- Tracking Info & Button -->
     <g transform="translate(15, 210)">
        <text x="0" y="0" font-size="12" fill="#6C757D">Tracking number:</text>
        <text x="0" y="18" font-size="14" fill="#495057">1Z1R034F01000000254</text>
        <!-- Outline Button -->
        <rect x="180" y="5" width="150" height="35" rx="4" ry="4" fill="#FFFFFF" stroke="#5EADD3" stroke-width="1"/>
        <text x="255" y="27.5" font-size="14" font-weight="500" fill="#5EADD3" text-anchor="middle">Track Shipment</text>
     </g>
  </g>

  <!-- Shipping Address Section -->
  <g id="shipping-info" transform="translate(30, 405)">
     <text x="0" y="0" font-size="14" font-weight="bold" fill="#495057">Shipping address:</text>
     <text x="0" y="20" font-size="14" fill="#6C757D">2802 Pearce Rd</text>
     <text x="0" y="38" font-size="14" fill="#6C757D">Austin, TX 78730</text>
  </g>


  <!-- Bottom Navigation Bar -->
  <g id="bottom-nav" transform="translate(0, 728)">
    <rect width="375" height="84" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="0.5"/>
    <!-- Icons -->
    <g transform="translate(36.875, 15)"> <!-- Home -->
       <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" stroke="#6C757D" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
       <polyline points="9 22 9 12 15 12 15 22" stroke="#6C757D" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
       <text x="10" y="35" font-size="10" fill="#6C757D" text-anchor="middle">Home</text>
    </g>
     <g transform="translate(130.625, 15)"> <!-- Prescriptions -->
       <path d="M10.5 20.5 A 10 10 0 0 1 10.5 0.5 A 10 10 0 0 1 10.5 20.5 M 5 10 L 16 10 M 10.5 5 L 10.5 15" stroke="#6C757D" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/> <!-- Capsule Icon -->
       <text x="10" y="35" font-size="10" fill="#6C757D" text-anchor="middle">Prescriptions</text>
    </g>
     <g transform="translate(224.375, 15)"> <!-- Orders (Selected) -->
        <path d="M1 3h15v13H1z M16 8h4l3 3v5h-7V8z" stroke="#5EADD3" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/> <!-- Truck Icon -->
        <circle cx="5.5" cy="18.5" r="2.5" stroke="#5EADD3" stroke-width="1.5" fill="none"/>
        <circle cx="18.5" cy="18.5" r="2.5" stroke="#5EADD3" stroke-width="1.5" fill="none"/>
       <text x="10" y="35" font-size="10" fill="#5EADD3" text-anchor="middle" font-weight="bold">Orders</text>
    </g>
     <g transform="translate(318.125, 15)"> <!-- Account -->
       <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" stroke="#6C757D" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
       <circle cx="12" cy="7" r="4" stroke="#6C757D" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
       <text x="10" y="35" font-size="10" fill="#6C757D" text-anchor="middle">Account</text>
    </g>
    <!-- Home indicator -->
    <rect x="121" y="70" width="134" height="5" rx="2.5" fill="#495057"/>
  </g>
</svg>
