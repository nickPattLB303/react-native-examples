<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>React Native Architecture</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
      margin: 0;
      padding: 20px;
      background-color: #f5f5f5;
    }
    .diagram {
      width: 600px;
      height: 400px;
      margin: 0 auto;
      background-color: white;
      border: 1px solid #ddd;
      border-radius: 5px;
      padding: 20px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    .title {
      text-align: center;
      font-size: 24px;
      margin-bottom: 20px;
      color: #333;
    }
    .container {
      display: flex;
      height: 300px;
    }
    .js-thread, .native-thread {
      flex: 1;
      padding: 15px;
      border-radius: 5px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .js-thread {
      background-color: #f0db4f;
      margin-right: 10px;
    }
    .native-thread {
      background-color: #61dafb;
      margin-left: 10px;
    }
    .bridge {
      width: 80px;
      background-color: #282c34;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      writing-mode: vertical-rl;
      text-orientation: mixed;
      font-weight: bold;
      border-radius: 5px;
    }
    .thread-title {
      text-align: center;
      font-weight: bold;
      margin-bottom: 10px;
    }
    .component {
      background-color: rgba(255, 255, 255, 0.7);
      padding: 10px;
      margin: 5px 0;
      border-radius: 3px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="diagram">
    <div class="title">React Native Architecture</div>
    <div class="container">
      <div class="js-thread">
        <div class="thread-title">JavaScript Thread</div>
        <div class="component">React Components</div>
        <div class="component">Business Logic</div>
        <div class="component">Virtual DOM</div>
        <div class="component">JavaScript Core</div>
      </div>
      <div class="bridge">
        Bridge
      </div>
      <div class="native-thread">
        <div class="thread-title">Native Thread</div>
        <div class="component">Native UI Components</div>
        <div class="component">Native Modules</div>
        <div class="component">Platform APIs</div>
        <div class="component">Native Rendering</div>
      </div>
    </div>
  </div>
</body>
</html>
